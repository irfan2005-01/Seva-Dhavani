<!doctype html>
<html lang="kn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153e38"><title>Seva Dhwani | Phone inbox</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf2ef;color:#18332e;font:18px/1.45 system-ui,"Noto Sans Kannada","Nirmala UI",sans-serif}header{background:#153e38;color:white;padding:14px 18px;display:flex;justify-content:space-between}header a{color:white}main{max-width:540px;margin:20px auto;padding:14px}.phone{background:#202c28;border-radius:34px;padding:18px 16px 24px;box-shadow:0 8px 22px #10251f30}.screen{background:#e4f0d9;border:3px solid #91a293;border-radius:12px;padding:16px;min-height:500px}.screen h1{font-size:1.2rem;margin:0 0 12px}.screen label{font-weight:750;display:block;margin:10px 0 5px}.screen input,.screen button{width:100%;font:inherit;min-height:52px;padding:10px;border:1px solid #84988e;border-radius:10px}.screen button{background:#145e53;border:0;color:white;font-weight:800;margin-top:10px}.hint,.error{font-size:.88rem}.error{color:#a2221c;font-weight:800}.messages{margin-top:16px}.sms{background:#fff;border:1px solid #bfccbf;border-radius:12px;padding:12px;margin:9px 0;overflow-wrap:anywhere}.sms small{display:block;color:#5d7067;margin-top:6px}.empty{padding:20px 6px;color:#526861}.link{display:block;margin:14px 2px;color:#145e53;font-weight:800}
</style></head><body><header><strong>Seva Dhwani | Phone inbox</strong><a href="/">Home</a></header><main><section class="phone"><div class="screen"><h1>Messages / SMS</h1><p>Enter the phone number used when the complaint was registered. This is a local read-only demo inbox.</p><label for="phone">Mobile number</label><input id="phone" type="tel" inputmode="tel" autocomplete="off"><button id="check">Show messages</button><p id="error" class="error" role="status"></p><div id="messages" class="messages"></div></div></section><a class="link" href="/ivr">← Phone / IVR simulator</a></main><script>
const $=id=>document.getElementById(id);$('check').addEventListener('click',async()=>{const phone=$('phone').value.trim();$('error').textContent='';$('messages').replaceChildren();if(!phone){$('error').textContent='Enter the mobile number.';return}try{const r=await fetch('/api/sms/inbox',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:'Inbox lookup failed');if(!data.messages.length){const p=document.createElement('p');p.className='empty';p.textContent='No SMS messages are available for this number yet.';$('messages').append(p)}for(const m of data.messages){const card=document.createElement('article');card.className='sms';const id=document.createElement('b');id.textContent=`Seva Dhwani | ${m.complaint_id}`;const text=document.createElement('div');text.textContent=m.message;const time=document.createElement('small');time.textContent=new Date(m.created_at).toLocaleString();card.append(id,text,time);$('messages').append(card)}}catch(e){$('error').textContent=e.message}})
</script><script>(function(){const h=document.createElement('div');h.style.cssText='position:sticky;top:0;z-index:9999;display:flex;gap:8px;justify-content:center;font:600 14px system-ui';document.body.prepend(h);const typed=document.createElement('span');typed.textContent='Offline/typed mode | typed input available';typed.style.cssText='background:#eef3f8;padding:6px 12px;border-radius:8px';h.append(typed);function p(){typed.style.background=navigator.onLine?'#eef3f8':'#fff3cd'}addEventListener('online',p);addEventListener('offline',p);p();fetch('/api/demo/status').then(r=>r.ok?r.json():null).then(d=>{if(d?.demo_mode){const x=document.createElement('span');x.textContent='DEMO MODE';x.style.cssText='background:#fce8a6;padding:6px 12px;border-radius:8px';h.prepend(x)}}).catch(()=>{})})();</script></body></html>
